name: daily_limit_plus
display_name: 每日调用限制Plus(订阅制版)
desc: 订阅制 + 群白名单无限量的 LLM 调用额度管理(JSON 持久化,爱发电对接)
short_desc: 订阅制 LLM 调用额度管理,支持月/季付费与群白名单
version: v2.9.1
author: Geekertao (Plus Fork)
repo: https://github.com/GoFelicity/astrbot_plugin_dailylimit-plus.git

# AstrBot 4.16+ 才会引入 on_decorating_result / 主动核验所需的 hook 行为,
# 为兼容性把最低版本抬到 4.16,并限制 5.0 之前可用
astrbot_version: ">=4.16,<5"

# 依赖 NapCat / aiocqhttp 提供 QQ 号,官方机器人也支持
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook

tags:
  - 安全
  - 限制
  - 实用
  - 管理
  - 使用控制
  - 订阅
  - 爱发电
  - 群白名单
